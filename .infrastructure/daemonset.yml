apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: busybox
  namespace: mateapp
spec:
  selector:
    matchLabels:
      app: busybox
  template:
    metadata:
      labels:
        app: busybox
    spec:
      containers:
        - name: busybox
          image: radial/busyboxplus:curl
          resources:
            limits:
              cpu: 100m
              memory: 200Mi
            requests:
              cpu: 100m
              memory: 100Mi
          env:
            - name: TARGET_URL
              value: http://todoapp-service:80/
          command: ["sh", "-c", "while true; do curl -s $TARGET_URL; sleep 5; done"]
